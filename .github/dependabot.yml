version: 2

# Dependabot configuration for Chainguard Libraries.
#
# IMPORTANT CAVEAT ABOUT CHAINGUARD VERSION SUFFIXES
# ---------------------------------------------------
# Chainguard appends `-0.cgr.N` to the upstream version (e.g. 6.2.19-0.cgr.1).
# Maven's version comparator treats "0.cgr.1" as a qualifier string and does
# lexicographic comparison when the qualifier doesn't match known tokens like
# "SNAPSHOT" or "RC". In practice `-0.cgr.2` is correctly ordered after
# `-0.cgr.1`, so Dependabot bumps between cgr revisions normally.
#
# If you observe Dependabot failing to detect updates for the Chainguard
# repo, prefer the Renovate config at the repo root (renovate.json) which has
# explicit versioning scheme control.

registries:
  # Remediated catalog: subset of upstream artifacts with -0.cgr.N backports.
  chainguard-remediated:
    type: maven-repository
    url: https://libraries.cgr.dev/java-remediated/
    username: ${{secrets.CHAINGUARD_JAVA_IDENTITY_ID}}
    password: ${{secrets.CHAINGUARD_JAVA_TOKEN}}
    replaces-base: true
  # Upstream mirror: proxies full Maven Central, carries resolution for
  # artifacts the remediated catalog doesn't cover (Gradle plugins, test
  # libs, cyclonedx). Public Maven Central is out of scope on both so
  # the comparator only sees Chainguard-hosted versions.
  chainguard-mirror:
    type: maven-repository
    url: https://libraries.cgr.dev/java/
    username: ${{secrets.CHAINGUARD_JAVA_IDENTITY_ID}}
    password: ${{secrets.CHAINGUARD_JAVA_TOKEN}}
    replaces-base: true

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    registries:
      - chainguard-remediated
      - chainguard-mirror
    open-pull-requests-limit: 5
    groups:
      spring-stack:
        patterns:
          - "org.springframework:*"
          - "org.springframework.boot:*"
          - "org.springframework.security:*"
    # Block plain upstream Spring versions coming from the mirror. By Maven's
    # version comparator, `3.5.15-0.cgr.1 < 3.5.15`, so a range like
    # `[3.5.15, )` catches the plain upstream but NOT the Chainguard -0.cgr.N
    # on the same base. Net effect: the mirror still covers non-Spring deps,
    # and Spring resolves to remediated's latest -0.cgr.N. Hand-maintain
    # these lower bounds as Chainguard advances to new upstream bases.
    ignore:
      - dependency-name: "org.springframework.boot*"
        versions: ["[3.5.15,)"]
      - dependency-name: "org.springframework:*"
        versions: ["[6.2.20,)"]
      - dependency-name: "org.springframework.security:*"
        versions: ["[6.5.12,)"]
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

