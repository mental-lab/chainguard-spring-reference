name: VEX advice
description: >
  Scan the built fat jar with Grype, cross-reference the Chainguard OpenVEX
  feed via suture, and emit a markdown advice report. Used by both the
  per-PR build workflow and the nightly VEX sweep.

inputs:
  jar-glob:
    description: Glob pointing at the fat jar to scan
    required: false
    default: build/libs/*.jar
  sbom-path:
    description: Path to the CycloneDX SBOM generated by the Gradle build
    required: false
    default: build/reports/application.cdx.json
  report-path:
    description: Where to write the markdown advice report
    required: false
    default: vex-report.md
  cache-path:
    description: Where to write the VEX fix cache
    required: false
    default: data/vex-cache.json
  gate:
    description: >
      "true" to fail if an unapplied Chainguard fix exists on an
      internet-facing Critical/High finding. "false" to report only.
    required: false
    default: "false"

outputs:
  report:
    description: Path to the markdown advice report
    value: ${{ inputs.report-path }}

runs:
  using: composite
  steps:
    - name: Install grype
      shell: bash
      run: |
        curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
          | sh -s -- -b /usr/local/bin

    - name: Install suture
      shell: bash
      run: |
        ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        curl -sSfL "https://github.com/mental-lab/suture/releases/latest/download/suture_${OS}_${ARCH}.tar.gz" \
          | tar -xz suture
        sudo install suture /usr/local/bin/
        suture --help > /dev/null

    - name: Scan with grype
      shell: bash
      run: |
        mkdir -p results
        # Resolve the fat-jar glob — grype doesn't expand globs itself; it would
        # treat "build/libs/*.jar" as a container-image reference.
        # Prefer the Spring Boot executable jar (not the plain -plain.jar).
        jar_path=$(ls build/libs/*.jar 2>/dev/null | grep -v -- '-plain\.jar$' | head -1)
        if [ -z "$jar_path" ]; then
          echo "::error::No jar found matching ${{ inputs.jar-glob }}"
          exit 1
        fi
        echo "Scanning: $jar_path"
        grype "$jar_path" -o json > results/jar-scan.json

    - name: Build VEX fix cache (scoped to project SBOM)
      shell: bash
      env:
        CHAINGUARD_JAVA_IDENTITY_ID: ${{ env.CHAINGUARD_JAVA_IDENTITY_ID }}
        CHAINGUARD_JAVA_TOKEN: ${{ env.CHAINGUARD_JAVA_TOKEN }}
      run: |
        mkdir -p "$(dirname "${{ inputs.cache-path }}")"
        suture fetch \
          --sbom "${{ inputs.sbom-path }}" \
          --out "${{ inputs.cache-path }}"

    - name: Advise (markdown for humans)
      shell: bash
      run: |
        suture advise \
          --scan-dir results/ \
          --cache "${{ inputs.cache-path }}" \
          --format markdown \
          --out "${{ inputs.report-path }}"

    - name: Advise (JSON for automation)
      shell: bash
      run: |
        suture advise \
          --scan-dir results/ \
          --cache "${{ inputs.cache-path }}" \
          --format json \
          --out "${{ inputs.report-path }}.json"

    - name: Fail if gate tripped
      if: inputs.gate == 'true'
      shell: bash
      run: |
        # Re-run with --gate purely for the exit code so this step fails the
        # workflow when there's an unapplied fix on a High/Critical finding.
        suture advise \
          --scan-dir results/ \
          --cache "${{ inputs.cache-path }}" \
          --format markdown \
          --gate
