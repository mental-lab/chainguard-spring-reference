name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  # Required so GitHub issues an OIDC token this workflow can exchange
  # for a short-lived Chainguard identity assertion.
  id-token: write

jobs:
  build:
    name: Build, test, and advise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # OIDC federation: no long-lived Chainguard credentials stored in the
      # repo. GitHub's workflow OIDC token is exchanged for a Chainguard
      # identity assertion. The identity UIDP must be configured in the repo
      # as the `CHAINGUARD_IDENTITY` variable, and its parent org UIDP as
      # `CHAINGUARD_PARENT`. See README.md for the one-time identity setup.
      - name: Set up chainctl via OIDC
        uses: chainguard-dev/setup-chainctl@main
        with:
          identity: ${{ vars.CHAINGUARD_IDENTITY }}

      - name: Mint short-lived pull token for libraries.cgr.dev
        run: |
          eval "$(chainctl auth pull-token \
                    --repository=java \
                    --parent=${{ vars.CHAINGUARD_PARENT }} \
                    --ttl=1h \
                    --output env)"
          # Export for subsequent steps. These are workflow-scoped env vars,
          # not GitHub secrets — they live only for this run.
          echo "CHAINGUARD_JAVA_IDENTITY_ID=$CHAINGUARD_JAVA_IDENTITY_ID" >> "$GITHUB_ENV"
          echo "CHAINGUARD_JAVA_TOKEN=$CHAINGUARD_JAVA_TOKEN" >> "$GITHUB_ENV"
          echo "::add-mask::$CHAINGUARD_JAVA_TOKEN"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build + test + SBOM (resolves from libraries.cgr.dev)
        run: ./gradlew --no-daemon --warning-mode all build cyclonedxBom

      - name: Dependency report (proves +cgr versions resolved)
        run: ./gradlew --no-daemon dependencies --configuration runtimeClasspath | tee runtime-dependencies.txt

      - name: VEX advice (gate on unapplied Chainguard fixes)
        uses: ./.github/actions/vex-advice
        with:
          gate: "true"

      - name: Post advice to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: suture-vex-advice
          path: vex-report.md

      - name: Upload advice artifact
        uses: actions/upload-artifact@v4
        with:
          name: vex-advice
          path: |
            vex-report.md
            vex-report.md.json
            runtime-dependencies.txt
            data/vex-cache.json
            results/jar-scan.json
